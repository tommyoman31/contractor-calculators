        <script type="text/javascript" src="https://payhip.com/embed-page.js?v=24u68985"></script>
        <script>
          // Payhip's loader binds init() to window "load", but since it injects
          // its scripts asynchronously, that event has often already fired by
          // the time init() is registered, so the widget never renders. Poll
          // briefly and call it ourselves, guarding against a double-init in
          // case the native "load" handler still fires too.
          (function retryInit(attempts) {
            var alreadyInitialized = document.querySelector('.payhip-embed-page iframe');
            if (alreadyInitialized) return;
            if (window.PayhipEmbedPage && typeof PayhipEmbedPage.init === 'function') {
              PayhipEmbedPage.init();
            } else if (attempts > 0) {
              setTimeout(function () { retryInit(attempts - 1); }, 200);
            }
          })(25);

          // Payhip's embed is also supposed to auto-resize the iframe once its
          // content loads, via a postMessage handshake from inside the iframe.
          // That handshake doesn't appear to fire reliably, leaving the iframe
          // collapsed at height 0. As a fallback, force a generous fixed height
          // once the iframe exists, and allow scrolling inside it so nothing is
          // ever cut off even if the real content runs longer.
          (function fallbackSize(attempts) {
            var iframe = document.querySelector('.payhip-embed-page iframe');
            if (iframe) {
              if (!iframe.getAttribute('height') || iframe.getAttribute('height') === '0') {
                iframe.setAttribute('height', '1500');
                iframe.setAttribute('scrolling', 'yes');
                iframe.style.minHeight = '1500px';
              }
              return;
            }
            if (attempts > 0) setTimeout(function () { fallbackSize(attempts - 1); }, 200);
          })(30);
        </script>
      </div>
    </div>
  </section>
